<!DOCTYPE html>
<html>
<head>
    <title>Piano Fire Game</title>
    <style>
        body {
            text-align: center;
            background: #222;
            color: white;
            font-family: Arial;
        }

        #game {
            width: 300px;
            height: 400px;
            background: white;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            border: 4px solid black;
        }

        .tile {
            width: 70px;
            height: 90px;
            background: black;
            position: absolute;
            border-radius: 5px;
            cursor: pointer;
        }

        button {
            padding: 10px 25px;
            background: orange;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎹 Piano Fire 🔥</h1>
    <h2>Score: <span id="score">0</span></h2>

    <div id="game"></div>

    <button onclick="startGame()">Start Game</button>

    <script>
        let score = 0;
        let tile;
        let position;
        let speed;
        let playing = false;
        let timer;
        let audio;

        function playSound() {
            if (!audio) {
                audio = new AudioContext();
            }

            audio.resume();

            let note = audio.createOscillator();
            let volume = audio.createGain();

            note.connect(volume);
            volume.connect(audio.destination);

            note.frequency.value = 500;
            note.type = "sine";

            volume.gain.setValueAtTime(0.3, audio.currentTime);
            volume.gain.exponentialRampToValueAtTime(
                0.001, audio.currentTime + 0.2
            );

            note.start();
            note.stop(audio.currentTime + 0.2);
        }

        function createTile() {
            if (!playing) return;

            tile = document.createElement("div");
            tile.className = "tile";

            position = 0;

            let lane = Math.floor(Math.random() * 4);
            tile.style.left = (lane * 75 + 2) + "px";
            tile.style.top = "0px";

            tile.onclick = function() {
                if (!playing || tile !== this) return;

                playSound();
                score++;
                document.getElementById("score").innerText = score;

                this.remove();
                createTile();
            };

            document.getElementById("game").appendChild(tile);

            moveTile();
        }

        function moveTile() {
            if (!playing || !tile) return;

            position += speed;
            tile.style.top = position + "px";

            if (position > 400) {
                endGame();
                return;
            }

            timer = requestAnimationFrame(moveTile);
        }

        function startGame() {
            cancelAnimationFrame(timer);

            document.getElementById("game").innerHTML = "";

            score = 0;
            speed = 2;
            playing = true;

            document.getElementById("score").innerText = score;

            createTile();
        }

        function endGame() {
            playing = false;
            cancelAnimationFrame(timer);

            alert("Game Over! Your score is " + score);
        }
    </script>

</body>
</html>
